<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142c5c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c1b39" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <title data-i18n="notFound.documentTitle">Pomodorough | Page not found</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/landing.css?v=3">
  <script src="/i18n.js?v=8" defer></script>
  <script src="/landing.js?v=2" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="/">
      <span class="wordmark-symbol" aria-hidden="true">P</span>
      <span>
        <strong>Pomodorough</strong>
        <small data-i18n="landing.tagline">Time, in transit</small>
      </span>
    </a>
  </header>

  <main>
    <section class="hero hero-single" aria-labelledby="notFound-title">
      <div class="hero-copy">
        <p class="eyebrow" data-i18n="notFound.eyebrow">Error 404 / no such stop</p>
        <h1 id="notFound-title" data-i18n="notFound.title">This page does not exist.</h1>
        <p class="hero-summary" data-i18n="notFound.summary">The address may be mistyped, or the page may have moved.</p>
        <div class="primary-actions">
          <a class="button button-native" href="/" data-i18n="public.home">Back to home</a>
          <a class="button button-web" href="/app" data-i18n="notFound.openApp">Open Web app</a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <span data-i18n="landing.footer">Pomodorough departure hall</span>
    <a href="/privacy" data-i18n="account.privacy">Privacy</a>
  </footer>
</body>
</html>
