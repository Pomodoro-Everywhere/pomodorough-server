name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out pinned shared core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Pomodoro-Everywhere/pomodorough-core
          ref: 15cdd9297e837f6c54f983517d0a78b24b5403b5
          path: shared-core
          persist-credentials: false
      - name: Rebuild and verify embedded shared core
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1
          (
            cd shared-core
            cargo +1.97.1 build --release --target wasm32-unknown-unknown --locked
          )
          rebuilt=shared-core/target/wasm32-unknown-unknown/release/pomodorough_core.wasm
          python3 shared-core/scripts/canonicalize_wasm_artifact.py "$rebuilt"
          python3 shared-core/scripts/verify_wasm_artifact.py \
            "$rebuilt"
          python3 shared-core/scripts/verify_wasm_artifact.py \
            internal/sharedcore/pomodorough_core.wasm \
            --sha256 59b5f540a9c2a5ad98a021d3e18aaafb3877266295a69c2992ba0f4aba4de12e
          python3 scripts/verify_shared_core_provenance.py \
            --sha256 59b5f540a9c2a5ad98a021d3e18aaafb3877266295a69c2992ba0f4aba4de12e \
            "$rebuilt" \
            internal/sharedcore/pomodorough_core.wasm \
            web/pomodorough_core.wasm
          cmp internal/sharedcore/pomodorough_core.wasm web/pomodorough_core.wasm
          test "$(cat internal/sharedcore/CORE_COMMIT)" = "15cdd9297e837f6c54f983517d0a78b24b5403b5"
          (cd internal/sharedcore && sha256sum --check pomodorough_core.wasm.sha256)
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Cross-build Windows server and store tests
        env:
          CGO_ENABLED: "0"
          GOARCH: amd64
          GOOS: windows
        run: |
          go test -c -o "$RUNNER_TEMP/store.test.exe" ./internal/store
          go build -o "$RUNNER_TEMP/pomodorough.exe" ./cmd/pomodorough
      - name: Test Windows lock build guard
        run: python3 -m unittest scripts/test_windows_lock_guard_s10.py -v
      - name: Test shared-core provenance verifier
        run: python3 -m unittest scripts/test_shared_core_provenance.py -v
      - name: Test integration credential documentation
        run: python3 -m unittest scripts/test_integration_credential_docs.py -v
      - name: Test with race detector
        run: go test -race ./...
      - name: Repeat Server race gate under package parallelism
        run: |
          for attempt in 1 2 3; do
            echo "Server race gate attempt $attempt"
            go test -race -count=1 -run '^TestLogicalProtocolClientsConvergeAcrossTimerTransitionTable$' ./internal/server &
            server_pid=$!
            go test -race -count=1 ./internal/store &
            store_pid=$!
            server_status=0
            store_status=0
            wait "$server_pid" || server_status=$?
            wait "$store_pid" || store_status=$?
            if [ "$server_status" -ne 0 ] || [ "$store_status" -ne 0 ]; then
              exit 1
            fi
          done
      - name: Vet
        run: go vet ./...
      - name: Scan reachable Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Check documentation links
        run: python3 scripts/check_docs.py
      - name: Check public privacy policy copy
        run: python3 scripts/check_privacy_policy.py

      - name: Check cross-client protocol fixture
        run: python3 scripts/check_protocol_fixture.py
      - name: Check workflow action pins
        run: python3 scripts/check_workflow_pins.py
      - name: Exercise SQLite restore drill
        run: |
          set -euo pipefail
          source_db="$(mktemp)"
          restore_dir="$(mktemp -d)"
          restored_db="$restore_dir/restored.sqlite3"
          python3 -c 'import sqlite3, sys; db = sqlite3.connect(sys.argv[1]); db.execute("CREATE TABLE probe(value TEXT NOT NULL)"); db.execute("INSERT INTO probe VALUES (?)", ("restore-ready",)); db.commit(); db.close()' "$source_db"
          python3 scripts/restore_drill.py "$source_db" "$restored_db"
          test "$(python3 -c 'import sqlite3, sys; print(sqlite3.connect(sys.argv[1]).execute("SELECT value FROM probe").fetchone()[0])' "$restored_db")" = "restore-ready"

  pwa:
    name: PWA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check generated shared-core metadata
        run: python3 scripts/generate_shared_core_metadata.py --check
      - name: Test
        run: npm run test:web
      - name: Check syntax
        run: npm run check:web

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
