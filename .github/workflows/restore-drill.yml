name: Scheduled restore drill

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-restore-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise bound data and deletion-ledger restore
        run: |
          set -euo pipefail
          python3 -m unittest scripts/test_restore_drill_s2.py -v
          go test ./internal/store -count=1 -run '^TestRecovery'
