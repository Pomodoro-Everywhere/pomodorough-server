name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Test server
        run: go test ./...
      - name: Test server with race detector
        run: go test -race ./...
      - name: Vet server
        run: go vet ./...
      - name: Scan reachable Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Check documentation links
        run: python3 scripts/check_docs.py
      - name: Check public privacy policy copy
        run: python3 scripts/check_privacy_policy.py
      - name: Check cross-client protocol fixture
        run: python3 scripts/check_protocol_fixture.py
      - name: Check workflow action pins
        run: python3 scripts/check_workflow_pins.py
      - name: Exercise SQLite restore drill
        run: |
          set -euo pipefail
          source_db="$(mktemp)"
          restore_dir="$(mktemp -d)"
          restored_db="$restore_dir/restored.sqlite3"
          python3 -c 'import sqlite3, sys; db = sqlite3.connect(sys.argv[1]); db.execute("CREATE TABLE probe(value TEXT NOT NULL)"); db.execute("INSERT INTO probe VALUES (?)", ("restore-ready",)); db.commit(); db.close()' "$source_db"
          python3 scripts/restore_drill.py "$source_db" "$restored_db"
          test "$(python3 -c 'import sqlite3, sys; print(sqlite3.connect(sys.argv[1]).execute("SELECT value FROM probe").fetchone()[0])' "$restored_db")" = "restore-ready"
      - name: Install PWA dependencies
        run: npm ci
      - name: Test PWA
        run: npm run test:web
      - name: Check PWA syntax
        run: npm run check:web

  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build reproducible archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="pomodorough-${version}-${GOOS}-${GOARCH}"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"

          mkdir -p "dist/${package}"
          CGO_ENABLED=0 go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -buildid=" \
            -o "dist/${package}/pomodorough" \
            ./cmd/pomodorough
          cp -R web deploy docs scripts README.md LICENSE "dist/${package}/"
          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C dist \
            -cf - \
            "${package}" | gzip -n > "dist/${package}.tar.gz"

          first_archive="$RUNNER_TEMP/${package}.first.tar.gz"
          cp "dist/${package}.tar.gz" "$first_archive"
          rm -rf "dist/${package}" "dist/${package}.tar.gz"
          mkdir -p "dist/${package}"
          CGO_ENABLED=0 go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -buildid=" \
            -o "dist/${package}/pomodorough" \
            ./cmd/pomodorough
          cp -R web deploy docs scripts README.md LICENSE "dist/${package}/"
          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C dist \
            -cf - \
            "${package}" | gzip -n > "dist/${package}.tar.gz"
          cmp "$first_archive" "dist/${package}.tar.gz"
      - name: Smoke-test archive layout and architecture
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="pomodorough-${version}-${GOOS}-${GOARCH}"
          archive="dist/${package}.tar.gz"
          extract="$(mktemp -d)"
          gzip -t "$archive"
          tar -xzf "$archive" -C "$extract"
          test -x "$extract/$package/pomodorough"
          test -f "$extract/$package/web/index.html"
          test -f "$extract/$package/web/privacy.html"
          test -f "$extract/$package/deploy/pomodorough.service"
          test -f "$extract/$package/deploy/pomodorough.env.example"
          test -x "$extract/$package/scripts/restore_drill.py"
          binary_kind="$(file -b "$extract/$package/pomodorough")"
          case "$GOOS/$GOARCH" in
            linux/amd64) grep -q 'ELF 64-bit.*x86-64' <<<"$binary_kind" ;;
            linux/arm64) grep -q 'ELF 64-bit.*ARM aarch64' <<<"$binary_kind" ;;
            darwin/arm64) grep -q 'Mach-O 64-bit.*arm64' <<<"$binary_kind" ;;
            *) echo "Unsupported release matrix entry: $GOOS/$GOARCH" >&2; exit 1 ;;
          esac
      - name: Attest archive provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.tar.gz
      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pomodorough-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source for SBOM
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pomodorough-*
          path: dist
          merge-multiple: true
      - name: Export SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/pomodorough-server.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.spdx.json > SHA256SUMS
      - name: Attest SBOM and checksum manifest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.spdx.json
            dist/SHA256SUMS
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.spdx.json \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --draft \
            --title "$GITHUB_REF_NAME"
      - name: Download and verify draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected_assets=(
            "pomodorough-${version}-darwin-arm64.tar.gz"
            "pomodorough-${version}-linux-amd64.tar.gz"
            "pomodorough-${version}-linux-arm64.tar.gz"
            "pomodorough-server.spdx.json"
            "SHA256SUMS"
          )
          verified="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" --dir "$verified"
          printf '%s\n' "${expected_assets[@]}" | sort > "$RUNNER_TEMP/expected-assets.txt"
          find "$verified" -mindepth 1 -maxdepth 1 -type f -exec basename {} \; | sort > "$RUNNER_TEMP/actual-assets.txt"
          cmp "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
          cd "$verified"
          sha256sum --check SHA256SUMS
          for archive in *.tar.gz; do
            gh attestation verify "$archive" --repo "$GH_REPO"
          done
          gh attestation verify pomodorough-server.spdx.json --repo "$GH_REPO"
          gh attestation verify SHA256SUMS --repo "$GH_REPO"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
