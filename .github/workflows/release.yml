name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-core:
    name: Verify embedded shared core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate tag-bound source identity
        run: |
          python3 scripts/release_identity.py validate-source \
            --tag "$GITHUB_REF_NAME" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --event-sha "$GITHUB_SHA" \
            --event-ref "$GITHUB_REF" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --github-repository "$GITHUB_REPOSITORY"
      - name: Check out pinned shared core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Pomodoro-Everywhere/pomodorough-core
          ref: 2af512330656b956839198f0c019b0031b2c1a8f
          path: shared-core
          persist-credentials: false
      - name: Restore Rust toolchain and cargo cache
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            ~/.rustup/toolchains
            shared-core/target
          key: release-rust-${{ runner.os }}-1.97.1-${{ hashFiles('shared-core/Cargo.lock') }}
          restore-keys: |
            release-rust-${{ runner.os }}-1.97.1-
      - name: Rebuild and verify embedded shared core
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1
          (
            cd shared-core
            cargo +1.97.1 build --release --target wasm32-unknown-unknown --locked
          )
          rebuilt=shared-core/target/wasm32-unknown-unknown/release/pomodorough_core.wasm
          python3 shared-core/scripts/canonicalize_wasm_artifact.py "$rebuilt"
          python3 shared-core/scripts/verify_wasm_artifact.py "$rebuilt"
          python3 shared-core/scripts/verify_wasm_artifact.py \
            internal/sharedcore/pomodorough_core.wasm \
            --sha256 7b1436dc24e7fedb52f52bd193be78a775f062bdfc4fcef25bb41caf5325e379
          python3 scripts/verify_shared_core_provenance.py \
            --sha256 7b1436dc24e7fedb52f52bd193be78a775f062bdfc4fcef25bb41caf5325e379 \
            "$rebuilt" \
            internal/sharedcore/pomodorough_core.wasm \
            web/pomodorough_core.wasm

  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate tag-bound source identity
        run: |
          python3 scripts/release_identity.py validate-source \
            --tag "$GITHUB_REF_NAME" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --event-sha "$GITHUB_SHA" \
            --event-ref "$GITHUB_REF" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --github-repository "$GITHUB_REPOSITORY"
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test server
        run: go test ./...
      - name: Cross-build Windows server and store tests
        env:
          CGO_ENABLED: "0"
          GOARCH: amd64
          GOOS: windows
        run: |
          go test -c -o "$RUNNER_TEMP/store.test.exe" ./internal/store
          go build -o "$RUNNER_TEMP/pomodorough.exe" ./cmd/pomodorough
      - name: Test Windows lock build guard
        run: python3 -m unittest scripts/test_windows_lock_guard_s10.py -v
      - name: Test shared-core provenance verifier
        run: python3 -m unittest scripts/test_shared_core_provenance.py -v
      - name: Test integration credential documentation
        run: python3 -m unittest scripts/test_integration_credential_docs.py -v
      - name: Test server with race detector
        run: go test -race ./...
      - name: Test release identity contract
        run: python3 -m unittest scripts/test_release_identity_s7.py -v
      - name: Vet server
        run: go vet ./...
      - name: Scan reachable Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Check documentation links
        run: python3 scripts/check_docs.py
      - name: Check public privacy policy copy
        run: python3 scripts/check_privacy_policy.py
      - name: Check cross-client protocol fixture
        run: python3 scripts/check_protocol_fixture.py
      - name: Check workflow action pins
        run: python3 scripts/check_workflow_pins.py
      - name: Check generated shared-core metadata
        run: python3 scripts/generate_shared_core_metadata.py --check
      - name: Exercise SQLite restore drill
        run: |
          set -euo pipefail
          source_db="$(mktemp)"
          restore_dir="$(mktemp -d)"
          restored_db="$restore_dir/restored.sqlite3"
          python3 -c 'import sqlite3, sys; db = sqlite3.connect(sys.argv[1]); db.execute("CREATE TABLE probe(value TEXT NOT NULL)"); db.execute("INSERT INTO probe VALUES (?)", ("restore-ready",)); db.commit(); db.close()' "$source_db"
          python3 scripts/restore_drill.py "$source_db" "$restored_db"
          test "$(python3 -c 'import sqlite3, sys; print(sqlite3.connect(sys.argv[1]).execute("SELECT value FROM probe").fetchone()[0])' "$restored_db")" = "restore-ready"

  verify-web:
    name: Verify PWA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate tag-bound source identity
        run: |
          python3 scripts/release_identity.py validate-source \
            --tag "$GITHUB_REF_NAME" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --event-sha "$GITHUB_SHA" \
            --event-ref "$GITHUB_REF" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --github-repository "$GITHUB_REPOSITORY"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install PWA dependencies
        run: npm ci
      - name: Test PWA
        run: npm run test:web
      - name: Check PWA syntax
        run: npm run check:web

  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: [verify, verify-core, verify-web]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            binary: pomodorough
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            binary: pomodorough
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            binary: pomodorough
          - goos: darwin
            goarch: arm64
            runner: macos-14
            binary: pomodorough
          - goos: windows
            goarch: amd64
            runner: windows-2022
            binary: pomodorough.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate tag-bound source identity
        if: matrix.goos != 'windows'
        run: |
          python3 scripts/release_identity.py validate-source \
            --tag "$GITHUB_REF_NAME" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --event-sha "$GITHUB_SHA" \
            --event-ref "$GITHUB_REF" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --github-repository "$GITHUB_REPOSITORY"
      - name: Validate tag-bound Windows source identity
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/release_identity.py validate-source `
            --tag "$env:GITHUB_REF_NAME" `
            --workflow-sha "$env:GITHUB_WORKFLOW_SHA" `
            --event-sha "$env:GITHUB_SHA" `
            --event-ref "$env:GITHUB_REF" `
            --workflow-ref "$env:GITHUB_WORKFLOW_REF" `
            --github-repository "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Windows data directory lock
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          go test ./internal/store -run '^TestDataDirLock'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build reproducible native binary
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BINARY_NAME: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/release_identity.py version "$GITHUB_REF_NAME")"
          ldflags="-s -w -buildid= -X=main.version=${version} -X=main.sourceCommit=${GITHUB_SHA}"
          ldflags+=" -X=main.embeddedVersionMarker=pomodorough-release-version:${version}"
          ldflags+=" -X=main.embeddedCommitMarker=pomodorough-release-commit:${GITHUB_SHA}"
          mkdir -p dist/native
          first_binary="$RUNNER_TEMP/pomodorough.first"
          second_binary="dist/native/${BINARY_NAME}"
          CGO_ENABLED=0 go build \
            -trimpath \
            -buildvcs=false \
            -ldflags "$ldflags" \
            -o "$first_binary" \
            ./cmd/pomodorough
          CGO_ENABLED=0 go build \
            -trimpath \
            -buildvcs=false \
            -ldflags "$ldflags" \
            -o "$second_binary" \
            ./cmd/pomodorough
          cmp "$first_binary" "$second_binary"
      - name: Build reproducible native Windows binary
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BINARY_NAME: ${{ matrix.binary }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = python scripts/release_identity.py version "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ldflags = "-s -w -buildid= -X=main.version=$version -X=main.sourceCommit=$env:GITHUB_SHA"
          $ldflags += " -X=main.embeddedVersionMarker=pomodorough-release-version:$version"
          $ldflags += " -X=main.embeddedCommitMarker=pomodorough-release-commit:$env:GITHUB_SHA"
          New-Item -ItemType Directory -Force -Path dist/native | Out-Null
          $firstBinary = Join-Path $env:RUNNER_TEMP "pomodorough.first.exe"
          $secondBinary = "dist/native/$env:BINARY_NAME"
          $env:CGO_ENABLED = "0"
          go build -trimpath -buildvcs=false -ldflags $ldflags -o $firstBinary ./cmd/pomodorough
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -buildvcs=false -ldflags $ldflags -o $secondBinary ./cmd/pomodorough
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $firstHash = (Get-FileHash -Algorithm SHA256 -Path $firstBinary).Hash
          $secondHash = (Get-FileHash -Algorithm SHA256 -Path $secondBinary).Hash
          if ($firstHash -cne $secondHash) { throw "Windows builds are not reproducible" }
      - name: Smoke-test and bind native binary identity
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BINARY_NAME: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/release_identity.py version "$GITHUB_REF_NAME")"
          package="pomodorough-${version}-${GOOS}-${GOARCH}"
          python3 scripts/release_identity.py record-binary \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --goos "$GOOS" \
            --goarch "$GOARCH" \
            --binary "dist/native/${BINARY_NAME}" \
            --output "dist/native/${package}.native.json"
      - name: Smoke-test and bind native Windows binary identity
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BINARY_NAME: ${{ matrix.binary }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = python scripts/release_identity.py version "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = "pomodorough-$version-$env:GOOS-$env:GOARCH"
          $nativeRecord = "dist/native/$package.native.json"
          python scripts/release_identity.py record-binary `
            --tag "$env:GITHUB_REF_NAME" `
            --commit "$env:GITHUB_SHA" `
            --goos "$env:GOOS" `
            --goarch "$env:GOARCH" `
            --binary "dist/native/$env:BINARY_NAME" `
            --output "$nativeRecord"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Attest immutable native test record
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/native/${{ matrix.binary }}
            dist/native/*.native.json
      - name: Upload native binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/native
          if-no-files-found: error
      - name: Upload immutable native test record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-record-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/native/*.native.json
          if-no-files-found: error

  package:
    name: Package ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: pomodorough
          - goos: linux
            goarch: arm64
            binary: pomodorough
          - goos: darwin
            goarch: amd64
            binary: pomodorough
          - goos: darwin
            goarch: arm64
            binary: pomodorough
          - goos: windows
            goarch: amd64
            binary: pomodorough.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate tag-bound source identity
        run: |
          python3 scripts/release_identity.py validate-source \
            --tag "$GITHUB_REF_NAME" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --event-sha "$GITHUB_SHA" \
            --event-ref "$GITHUB_REF" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --github-repository "$GITHUB_REPOSITORY"
      - name: Download native binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: binary
      - name: Verify native binary and test-record attestations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s\0' binary/* | xargs -0 -P 4 -I{} gh attestation verify {} --repo "$GH_REPO"
      - name: Build reproducible archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BINARY_NAME: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/release_identity.py version "$GITHUB_REF_NAME")"
          package="pomodorough-${version}-${GOOS}-${GOARCH}"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          chmod 0755 "binary/${BINARY_NAME}"

          assemble_archive() {
            rm -rf "dist/${package}" "dist/${package}.tar.gz"
            mkdir -p "dist/${package}"
            install -m 0755 "binary/${BINARY_NAME}" "dist/${package}/${BINARY_NAME}"
            cp -R web deploy docs scripts README.md LICENSE "dist/${package}/"
            tar \
              --sort=name \
              --mtime="@${source_date_epoch}" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              -C dist \
              -cf - \
              "${package}" | gzip -n > "dist/${package}.tar.gz"
          }

          assemble_archive
          first_archive="$RUNNER_TEMP/${package}.first.tar.gz"
          cp "dist/${package}.tar.gz" "$first_archive"
          assemble_archive
          cmp "$first_archive" "dist/${package}.tar.gz"
      - name: Bind final archive to native-tested binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BINARY_NAME: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/release_identity.py version "$GITHUB_REF_NAME")"
          package="pomodorough-${version}-${GOOS}-${GOARCH}"
          python3 scripts/release_identity.py bind-archive \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --goos "$GOOS" \
            --goarch "$GOARCH" \
            --native-record "binary/${package}.native.json" \
            --binary "binary/${BINARY_NAME}" \
            --archive "dist/${package}.tar.gz" \
            --output "dist/${package}.identity.json"
      - name: Attest archive and identity binding
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.identity.json
      - name: Upload archive and identity binding
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pomodorough-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.identity.json
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source for SBOM
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate tag-bound source identity
        run: |
          python3 scripts/release_identity.py validate-source \
            --tag "$GITHUB_REF_NAME" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --event-sha "$GITHUB_SHA" \
            --event-ref "$GITHUB_REF" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --github-repository "$GITHUB_REPOSITORY"
      - name: Download archives and identity bindings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pomodorough-*
          path: dist
          merge-multiple: true
      - name: Download immutable native test records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-record-*
          path: trusted-native-records
          merge-multiple: true
      - name: Verify package attestations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s\0' dist/*.tar.gz dist/*.identity.json | xargs -0 -P 4 -I{} gh attestation verify {} --repo "$GH_REPO"
      - name: Export SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/pomodorough-server.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Verify and import immutable native test records
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s\0' trusted-native-records/*.native.json | xargs -0 -P 5 -I{} sh -c 'record="{}"; gh attestation verify "$record" --repo "$GH_REPO"'
          cp -- trusted-native-records/*.native.json dist/
      - name: Finalize release identity and checksums
        run: |
          python3 scripts/release_identity.py finalize-release \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --directory dist \
            --native-record-directory trusted-native-records \
            --output dist/SHA256SUMS
      - name: Attest SBOM and checksum manifest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.spdx.json
            dist/SHA256SUMS
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.identity.json \
            dist/*.native.json \
            dist/*.spdx.json \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --draft \
            --title "$GITHUB_REF_NAME"
      - name: Download and verify draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/release_identity.py version "$GITHUB_REF_NAME")"
          expected_assets=(
            "pomodorough-${version}-darwin-amd64.tar.gz"
            "pomodorough-${version}-darwin-amd64.identity.json"
            "pomodorough-${version}-darwin-amd64.native.json"
            "pomodorough-${version}-darwin-arm64.tar.gz"
            "pomodorough-${version}-darwin-arm64.identity.json"
            "pomodorough-${version}-darwin-arm64.native.json"
            "pomodorough-${version}-linux-amd64.tar.gz"
            "pomodorough-${version}-linux-amd64.identity.json"
            "pomodorough-${version}-linux-amd64.native.json"
            "pomodorough-${version}-linux-arm64.tar.gz"
            "pomodorough-${version}-linux-arm64.identity.json"
            "pomodorough-${version}-linux-arm64.native.json"
            "pomodorough-${version}-windows-amd64.tar.gz"
            "pomodorough-${version}-windows-amd64.identity.json"
            "pomodorough-${version}-windows-amd64.native.json"
            "pomodorough-server.spdx.json"
            "SHA256SUMS"
          )
          verified="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" --dir "$verified"
          printf '%s\n' "${expected_assets[@]}" | sort > "$RUNNER_TEMP/expected-assets.txt"
          find "$verified" -mindepth 1 -maxdepth 1 -type f -exec basename {} \; | sort > "$RUNNER_TEMP/actual-assets.txt"
          cmp "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
          python3 scripts/release_identity.py verify-release \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --directory "$verified" \
            --checksums "$verified/SHA256SUMS"
          printf '%s\0' "$verified"/*.tar.gz "$verified"/*.identity.json "$verified"/*.native.json | xargs -0 -P 4 -I{} gh attestation verify {} --repo "$GH_REPO"
          gh attestation verify "$verified/pomodorough-server.spdx.json" --repo "$GH_REPO" &
          spdx_pid=$!
          gh attestation verify "$verified/SHA256SUMS" --repo "$GH_REPO" &
          sums_pid=$!
          wait "$spdx_pid"
          wait "$sums_pid"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
